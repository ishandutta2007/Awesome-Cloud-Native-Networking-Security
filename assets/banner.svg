<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="40%" stop-color="#0d1527"/><stop offset="100%" stop-color="#070a14"/></linearGradient><radialGradient id="mesh-glow-cyan" cx="20%" cy="30%" r="60%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".25"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></radialGradient><radialGradient id="mesh-glow-purple" cx="80%" cy="70%" r="60%"><stop offset="0%" stop-color="#7928ca" stop-opacity=".3"/><stop offset="100%" stop-color="#7928ca" stop-opacity="0"/></radialGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="45%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".45" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulsePacket{0%{stroke-dashoffset:400;opacity:.2}50%{opacity:1}}@keyframes pulseNode{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.25);opacity:1;filter:drop-shadow(0 0 8px #00f2fe)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sweepRadar{0%{transform:rotate(0deg)}}.circuit-line{stroke-dasharray:80 120;animation:pulsePacket 6s linear infinite}.node-pulse,.node-pulse-delayed{transform-origin:center;animation:pulseNode 3s ease-in-out infinite}.node-pulse-delayed{animation:pulseNode 3.5s ease-in-out infinite 1.2s}.pill-float-1{animation:floatPill 4s ease-in-out infinite}.pill-float-2{animation:floatPill 4.5s ease-in-out infinite 1s}.pill-float-3{animation:floatPill 5s ease-in-out infinite 2s}.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:500;letter-spacing:.2px}.pill-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;font-weight:600}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#mesh-glow-cyan)" rx="16"/><rect width="1200" height="360" fill="url(#mesh-glow-purple)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g opacity=".6"><path fill="none" stroke="#00f2fe" stroke-width="2" d="M -50 180 Q 200 40, 450 160 T 950 100 T 1250 220" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="3" d="M -50 180 Q 200 40, 450 160 T 950 100 T 1250 220" class="circuit-line" filter="url(#glow)"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M -50 280 Q 300 340, 600 240 T 1050 300 T 1250 140" opacity=".35"/><path class="circuit-line" style="animation-duration:7.5s;animation-direction:reverse" fill="none" stroke="#c084fc" stroke-width="2.5" d="M -50 280 Q 300 340, 600 240 T 1050 300 T 1250 140"/><g transform="translate(140, 90)"><circle r="6" fill="#00f2fe" class="node-pulse"/><circle r="14" fill="none" stroke="#00f2fe" stroke-width="1" opacity=".4"/></g><g transform="translate(1040, 80)"><circle r="6" fill="#a855f7" class="node-pulse-delayed"/><circle r="16" fill="none" stroke="#a855f7" stroke-width="1" opacity=".4"/></g><g transform="translate(1080, 270)"><circle r="5" fill="#38bdf8" class="node-pulse"/><circle r="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".3"/></g><g transform="translate(100, 290)"><circle r="5" fill="#06b6d4" class="node-pulse-delayed"/><circle r="12" fill="none" stroke="#06b6d4" stroke-width="1" opacity=".3"/></g></g><g class="pill-float-1" transform="translate(90, 50)"><rect width="125" height="34" fill="url(#pill-grad)" stroke="#0284c7" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="4" fill="#38bdf8"/><text x="32" y="22" fill="#38bdf8" class="pill-text">⚡ eBPF Mesh</text></g><g class="pill-float-2" transform="translate(980, 45)"><rect width="135" height="34" fill="url(#pill-grad)" stroke="#9333ea" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="4" fill="#c084fc"/><text x="32" y="22" fill="#c084fc" class="pill-text">🛡️ Zero Trust</text></g><g class="pill-float-3" transform="translate(960, 275)"><rect width="150" height="34" fill="url(#pill-grad)" stroke="#059669" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="4" fill="#34d399"/><text x="32" y="22" fill="#34d399" class="pill-text">☸️ K8s Security</text></g><g class="pill-float-1" transform="translate(90, 280)"><rect width="145" height="34" fill="url(#pill-grad)" stroke="#d97706" stroke-width="1.2" rx="17"/><circle cx="18" cy="17" r="4" fill="#fbbf24"/><text x="32" y="22" fill="#fbbf24" class="pill-text">🔍 Runtime Sec</text></g><g text-anchor="middle"><text y="0" fill="url(#text-grad)" class="title-text" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))" font-size="44" transform="translate(600, 145)">Awesome Cloud-Native</text><text y="52" fill="#fff" class="title-text" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))" font-size="42" transform="translate(600, 145)">Networking &amp; Security</text><text y="98" fill="#94a3b8" class="subtitle-text" font-size="16" transform="translate(600, 145)">The Curated Guide to eBPF Dataplanes, Microsegmentation, K8s CNIs &amp; Runtime CNAPP</text></g><rect width="1200" height="360" fill="none" stroke="#334155" stroke-width="1.5" opacity=".6" rx="16"/></svg>