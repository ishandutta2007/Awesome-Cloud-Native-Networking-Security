<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Mesh Glow Gradient -->
    <radialGradient id="mesh-glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-glow-purple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Badge / Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulsePacket {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes sweepRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .circuit-line {
      stroke-dasharray: 80 120;
      animation: pulsePacket 6s linear infinite;
    }
    .node-pulse {
      transform-origin: center;
      animation: pulseNode 3s ease-in-out infinite;
    }
    .node-pulse-delayed {
      transform-origin: center;
      animation: pulseNode 3.5s ease-in-out infinite 1.2s;
    }
    .pill-float-1 {
      animation: floatPill 4s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPill 4.5s ease-in-out infinite 1s;
    }
    .pill-float-3 {
      animation: floatPill 5s ease-in-out infinite 2s;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Radial Glow Overlays in Background -->
  <rect width="1200" height="360" rx="16" fill="url(#mesh-glow-cyan)"/>
  <rect width="1200" height="360" rx="16" fill="url(#mesh-glow-purple)"/>

  <!-- Matrix Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Network Circuit / Mesh Flow in Background (non-obstructive) -->
  <g opacity="0.6">
    <!-- Curved flow line 1 -->
    <path d="M -50 180 Q 200 40, 450 160 T 950 100 T 1250 220" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.4"/>
    <path class="circuit-line" d="M -50 180 Q 200 40, 450 160 T 950 100 T 1250 220" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>

    <!-- Curved flow line 2 -->
    <path d="M -50 280 Q 300 340, 600 240 T 1050 300 T 1250 140" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35"/>
    <path class="circuit-line" style="animation-duration: 7.5s; animation-direction: reverse;" d="M -50 280 Q 300 340, 600 240 T 1050 300 T 1250 140" fill="none" stroke="#c084fc" stroke-width="2.5"/>

    <!-- Mesh Nodes & Radar Elements -->
    <g transform="translate(140, 90)">
      <circle class="node-pulse" r="6" fill="#00f2fe"/>
      <circle r="14" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.4"/>
    </g>
    <g transform="translate(1040, 80)">
      <circle class="node-pulse-delayed" r="6" fill="#a855f7"/>
      <circle r="16" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    </g>
    <g transform="translate(1080, 270)">
      <circle class="node-pulse" r="5" fill="#38bdf8"/>
      <circle r="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    </g>
    <g transform="translate(100, 290)">
      <circle class="node-pulse-delayed" r="5" fill="#06b6d4"/>
      <circle r="12" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    </g>
  </g>

  <!-- Animated Interactive Pills (Floating softly at sides, not covering title) -->
  <g class="pill-float-1" transform="translate(90, 50)">
    <rect width="125" height="34" rx="17" fill="url(#pill-grad)" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#38bdf8"/>
    <text x="32" y="22" fill="#38bdf8" class="pill-text">⚡ eBPF Mesh</text>
  </g>

  <g class="pill-float-2" transform="translate(980, 45)">
    <rect width="135" height="34" rx="17" fill="url(#pill-grad)" stroke="#9333ea" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#c084fc"/>
    <text x="32" y="22" fill="#c084fc" class="pill-text">🛡️ Zero Trust</text>
  </g>

  <g class="pill-float-3" transform="translate(960, 275)">
    <rect width="150" height="34" rx="17" fill="url(#pill-grad)" stroke="#059669" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#34d399"/>
    <text x="32" y="22" fill="#34d399" class="pill-text">☸️ K8s Security</text>
  </g>

  <g class="pill-float-1" transform="translate(90, 280)">
    <rect width="145" height="34" rx="17" fill="url(#pill-grad)" stroke="#d97706" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#fbbf24"/>
    <text x="32" y="22" fill="#fbbf24" class="pill-text">🔍 Runtime Sec</text>
  </g>

  <!-- FOREGROUND: Solid, perfectly legible Brand Title & Subtitle -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <!-- Primary Title -->
    <text y="0" font-size="44" fill="url(#text-grad)" class="title-text" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))">
      Awesome Cloud-Native
    </text>
    <text y="52" font-size="42" fill="#ffffff" class="title-text" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.85))">
      Networking &amp; Security
    </text>

    <!-- Subtitle -->
    <text y="98" font-size="16" fill="#94a3b8" class="subtitle-text">
      The Curated Guide to eBPF Dataplanes, Microsegmentation, K8s CNIs &amp; Runtime CNAPP
    </text>
  </g>

  <!-- Border Accent -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
</svg>
